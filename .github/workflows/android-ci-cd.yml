name: Android CI/CD

on:
  push:
    branches:
      - main
      - develop
      - 'releases/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  MAVEN_REPO: ghcr.io
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  JAVA_VERSION: '17'
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dkotlin.compiler.execution.in.strategy=IN_PROCESS

jobs:
  # ===================== CODE QUALITY =====================
  lint:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Run Kotlin Lint
        run: ./gradlew ktlintCheck --stacktrace
      
      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace
      
      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: app/build/reports/lint-results-*.html
          retention-days: 7

  # ===================== UNIT TESTS =====================
  unit-tests:
    name: Unit Tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7
      
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            app/build/reports/coverage/
            app/build/reports/lcov/
          retention-days: 7

  # ===================== BUILD VERIFICATION =====================
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
      
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
      
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7

  # ===================== INSTRUMENTED TESTS =====================
  instrumentation-tests:
    name: Instrumented Tests on Android Device
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        api-level: [24, 33, 35]
        target: [default]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: Nexus 6
          script: ./gradlew connectedDebugAndroidTest --stacktrace
          disable-animations: true
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-test-results-api-${{ matrix.api-level }}
          path: app/build/reports/androidTests/
          retention-days: 7

  # ===================== ASSET GENERATION =====================
  bundle:
    name: Generate Release Bundle (AAB)
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Sign app bundle
        env:
          KEYSTORE_FILE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_FILE_BASE64" | base64 --decode > app/keystore.jks
      
      - name: Build signed bundle
        run: ./gradlew assembleRelease --stacktrace
        env:
          KEYSTORE_FILE: app/keystore.jks
      
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle-release
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

  # ===================== DEPLOYMENT TO GITHUB RELEASE =====================
  deploy-release:
    name: Deploy to GitHub Releases
    runs-on: ubuntu-latest
    needs: bundle
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download bundle
        uses: actions/download-artifact@v4
        with:
          name: app-bundle-release
          path: ./bundle
      
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: app-release-${{ github.sha }}
          path: ./apk
      
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "Release ${{ github.ref_name }}" \
            --notes "## 🚀 Changelog\n\n## 📦 Assets\n\n- \`\`\`aab\n$(cat ./bundle/app-release.aab | base64)\n\`\`\`\n- \`\`\`apk\n$(cat ./apk/app-release-unsigned.apk | base64)\n\`\`\`"
      
      - name: Upload bundle to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} \
            ./bundle/app-release.aab \
            --clobber

  # ===================== DEPLOYMENT TO GOOGLE PLAY (OPTIONAL) =====================
  deploy-play-store:
    name: Deploy to Google Play
    runs-on: ubuntu-latest
    needs: bundle
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: google_play
      url: https://play.google.com/store/apps/details?id=com.decloudius.jmodupe
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Download bundle
        uses: actions/download-artifact@v4
        with:
          name: app-bundle-release
          path: ./bundle
      
      - name: Deploy to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.decloudius.jmodupe
          releaseFiles: ./bundle/app-release.aab
          track: internal
          status: completed

  # ===================== DEPLOYMENT TO TEST FLIGHT (OPTIONAL) =====================
  deploy-test-flight:
    name: Deploy to Test Flight
    runs-on: ubuntu-latest
    needs: [build, instrumentation-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: test_flight
      url: https://play.google.com/store/apps/details?id=com.decloudius.jmodupe
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Download bundle
        uses: actions/download-artifact@v4
        with:
          name: app-bundle-release
          path: ./bundle
      
      - name: Deploy to Test Flight
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.decloudius.jmodupe
          releaseFiles: ./bundle/app-release.aab
          track: internal
          status: inProgress
          inProgressStatus: testing